[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-hvac"
version = "0.1.0"
description = "Deterministic HVAC design contracts and engineering workflow foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "coolprop==8.0.0",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "pint>=0.24,<1",
  "tespy==0.11.2",
]

[project.optional-dependencies]
gui = [
    "streamlit>=1.63,<2",
]

[dependency-groups]
dev = [
  "hatchling>=1.27,<2", "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2",
  "types-openpyxl>=3.1,<4"
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hvac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agent_hvac"]
exclude = ["^src[\\\\/]agent_hvac[\\\\/]app[\\\\/](streamlit_app|design_workbench_app)\\.py$"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/docs", "/data", "/examples", "/.github",
  "/AGENTS.md", "/CURRENT_STATE.md", "/README.md",
  "/pyproject.toml", "/uv.lock", "/.python-version", "/.env.example", "/.gitignore", "/.gitattributes"
]
exclude = ["**/__pycache__", "**/*.pyc"]
